[workspace]
members = ["crates/*"]
exclude = ["rv-tests"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
authors = ["clabby"]
repository = "https://github.com/clabby/brisc"
homepage = "https://github.com/clabby/brisc"
keywords = ["risc-v", "emulator", "interpreter", "hardware", "isa"]
categories = ["emulators", "risc-v"]

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unnameable_types = "warn"

[workspace.lints.rustdoc]
all = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
missing_const_for_fn = "warn"
use_self = "warn"
option_if_let_else = "warn"
redundant_clone = "warn"
unusual_byte_groupings = "allow"

[workspace.dependencies]
# Local
brisc-isa = { path = "crates/isa", default-features = false }
brisc-jit = { path = "crates/jit", default-features = false }
brisc-hw = { path = "crates/hw", default-features = false }
brisc-emu = { path = "crates/emu", default-features = false }

# External
cfg-if = "1.0.0"
hashbrown = "0.15"
thiserror = { version = "2.0.11", default-features = false }
num-traits = { version = "0.2", default-features = false }

# Testing + Benchmarking
tracing = "0.1"
tracing-subscriber = "0.3"
rstest = "0.26.0"
criterion = "0.5.1"

[profile.dev]
opt-level = 1
overflow-checks = false

[profile.bench]
debug = true

[profile.release]
codegen-units = 1
lto = "fat"
