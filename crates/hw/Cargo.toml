[package]
name = "brisc-hw"
description = "Implementation of the hardware components of a RISC-V i{mac} processor."
version = "0.0.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# Local
brisc-isa.workspace = true
brisc-jit = { workspace = true, optional = true }

# External
thiserror.workspace = true
hashbrown.workspace = true

[dev-dependencies]
rstest.workspace = true

[features]
default = [ "64-bit", "a", "c", "m" ]

# Architecture features
64-bit = [ "brisc-isa/64-bit" ]
m = [ "brisc-isa/m" ]
a = [ "brisc-isa/a" ]
c = [ "brisc-isa/c" ]

# A JIT compiler for hot loops. It needs the standard library and 64-bit registers.
jit = [ "64-bit", "dep:brisc-jit" ]
